# Run the test suites on every push to master.
#
# The backend job has a real Postgres beside it: tests/test_postgres_backend.py
# runs every database method against both backends, because comparing method
# names (tests/test_backend_parity.py) cannot catch SQL that Postgres rejects.
# The rest of the suite stays on SQLite, whose fixtures point the app database
# at a temporary file.
name: Tests

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: clio_test
          POSTGRES_DB: clio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CLIO_TEST_POSTGRES_URL: postgresql://postgres:clio_test@localhost:5432/clio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-postgres.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-postgres.txt -r requirements-dev.txt
      - run: python -m pytest -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # Component tests mount whole panels, and the 5 s default is tight on a
      # small shared runner.
      - run: npm test -- --testTimeout=20000
      - run: npm run build
