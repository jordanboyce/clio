# Publish the deployable image to GitHub Container Registry.
#
# This is how a site that is allowed to reach the internet installs without
# building: `docker pull ghcr.io/<owner>/clio:<tag>`. A site that is not
# gets the same image as a file — see scripts/package_image.sh.
#
# Runs on a version tag (v1.2.3) and on demand. Not on every push: the build
# compiles a torch/faiss dependency set and takes tens of minutes.
#
# Two variants build side by side from the same Dockerfile:
#   full  :latest, :1.2.3, :1.2        everything (PyTorch, OCR, audio)
#   slim  :slim, :1.2.3-slim, :1.2-slim  SLIM=1 — about 1.6 GB instead of
#         4.0 GB, no PyTorch/OCR/audio, the fastembed search model and
#         reranker still baked in. The quick start leads with it because the
#         pull is what stands between a new user and a running app.
name: Publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (default: the commit SHA)"
        required: false
      offline_bundle:
        description: "Bake every model into the image (~1 GB larger)"
        type: boolean
        default: false
      arm64:
        description: "Also build linux/arm64 (slow — emulated)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            suffix: ""
            slim: "0"
          - variant: slim
            suffix: "-slim"
            slim: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: inputs.arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercased by the action — a registry path cannot carry the
          # capitals a GitHub owner name may have.
          images: ghcr.io/${{ github.repository }}
          # The variant suffix lands on every tag (1.2.3-slim, sha-abc-slim);
          # the slim image's moving tag is plain :slim, not :latest-slim.
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ matrix.variant == 'full' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=slim,suffix=,enable=${{ matrix.variant == 'slim' && startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ inputs.arm64 && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            OFFLINE_BUNDLE=${{ inputs.offline_bundle && '1' || '0' }}
            SLIM=${{ matrix.slim }}
          # One cache per variant: they share base layers but diverge at the
          # dependency install, and a shared scope would evict each other.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Summarise
        run: |
          {
            echo "### Published (${{ matrix.variant }})"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Pull it on the target host, or carry it in with"
            echo '`scripts/package_image.sh` for a network with no registry access.'
          } >> "$GITHUB_STEP_SUMMARY"
