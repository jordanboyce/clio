<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <!-- The mark is a gradient, so the tab icon follows the browser chrome
         rather than being recoloured. favicon.ico stays the fallback for
         browsers that ignore media on an icon link. -->
    <link rel="icon" type="image/png" href="/clio-mark.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="/clio-mark-dark.png" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
      <meta name="apple-mobile-web-app-title" content="Clio">
      <meta name="application-name" content="Clio">
      <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
      <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111827">
      <meta name="description" content="Clio — index your own documents and data, ask questions, and get answers grounded in your sources with citations.">
      <meta name="robots" content="noindex">
      <meta property="og:title" content="Clio">
      <meta property="og:description" content="Answers from your own sources, with citations. Named for the Muse of history: the record remembers.">
      <meta property="og:image" content="/clio-og.png">
      <meta property="og:type" content="website">
      <meta name="twitter:card" content="summary_large_image">
      <title>Clio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
