# Clio — docker compose deployment.
#
#   docker compose up -d
#   open http://localhost:8473
#
# NOTE: `up -d` only builds the image the FIRST time. After pulling or
# changing code, rebuild explicitly:  docker compose up -d --build
#
# No .env required to start; drop one next to this file to override defaults
# (see .env.example). Documents and indexes persist in ./data.

services:
  clio:
    # A fixed name, so the image can be saved, carried and loaded elsewhere
    # under a name that does not depend on this directory's name:
    #   docker compose build && docker save clio:local | gzip > a.tar.gz
    # Point CLIO_IMAGE at a prebuilt or registry image to run that
    # instead — docker-compose.onprem.yml does exactly that.
    image: ${CLIO_IMAGE:-clio:local}
    build:
      context: .
      # Air-gapped deployments: bake ALL runtime models (reranker, Whisper,
      # Docling OCR) into the image so nothing is downloaded after build.
      # Uncomment, build on a connected machine, then `docker save` the image
      # and `docker load` it inside the air gap — see docs/AIRGAP.md.
      # args:
      #   OFFLINE_BUNDLE: "1"
      # Bake the built-in embedding model (all-MiniLM-L6-v2) into the image.
      # Needs huggingface.co reachable at build time; leave off on networks
      # that block the hub and set EMBEDDING_PROVIDER to ollama / a hosted
      # API instead.
      args:
        BAKE_EMBEDDING: "${BAKE_EMBEDDING:-1}"
    container_name: clio
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8473:8473"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - HOST=0.0.0.0
      - PORT=8473
      # Starting point for embeddings: the built-in model inside the container.
      # Settings → Indexing → Embedding can switch to a hosted provider
      # (Google Gemini, Mistral, Voyage, Jina, OpenAI, …) at runtime; that
      # choice is stored in the app database under ./data and wins over these.
      - EMBEDDING_PROVIDER=local
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      # Reach an Ollama instance on the docker host, if you run one
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # The LLM this deployment uses for everyone, so nobody configures a
      # model in their own browser. Leave unset for the bring-your-own-key
      # behaviour; set it for an on-prem private endpoint (vLLM, LM Studio,
      # llama.cpp, TGI, a gateway) — see docs/ONPREM.md.
      # - AI_PROVIDER=openai_compatible
      # - AI_BASE_URL=http://vllm.internal:8000/v1
      # - AI_MODEL=llama-3.3-70b-instruct
      # - AI_API_KEY=
      # - AI_PROVIDER_LABEL=Acme Internal LLM
      # Air-gapped mode: disables cloud AI providers and every HuggingFace
      # download — the container makes no outbound connections beyond the
      # Ollama/self-hosted endpoints you configure. See docs/AIRGAP.md.
      # - OFFLINE_MODE=1
      # Shared-secret auth: require this password (Basic or Bearer) on every
      # request. Recommended whenever others can reach the port.
      # - AUTH_PASSWORD=change-me
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Shutdown flushes every loaded index to disk (indexer_manager.save_all()).
    # Docker's 10s default can SIGKILL that mid-write on a large corpus, so give
    # it room; a healthy shutdown still exits as soon as the flush completes.
    stop_grace_period: 60s
    # Healthcheck comes from the Dockerfile (curl /health).
