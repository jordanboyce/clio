# Remote deployment override — Clio behind Cloudflare Tunnel + Access.
#
#   docker compose -f docker-compose.yml -f docker-compose.remote.yml up -d --build
#
# This is deployment shape B from docs/DEPLOYMENT.md: the app publishes NO
# port; the only way in is the tunnel, and Cloudflare Access decides who gets
# through it. See docs/REMOTE-ACCESS.md for the one-time Cloudflare setup.
#
# Required in .env (next to this file):
#   TUNNEL_TOKEN=...     # from the Cloudflare Zero Trust tunnel you create
#
# Initial allowlist for scripts/provision_cloudflare.py:
#   CLIO_ALLOW_EMAILS=you@example.com,teammate@example.com

services:
  clio:
    # Override the base file's published port: the tunnel is the only route in.
    ports: !reset []
    expose:
      - "8473"
    # Tunnels provisioned before the Clio rename point their ingress at
    # http://asymptote:8473. Keep that name resolving on the compose network so
    # the rename does not require touching the Cloudflare side.
    networks:
      default:
        aliases:
          - asymptote
    environment:
      # Fail closed even if a request reaches the app without an Access JWT.
      - AUTH_REQUIRE_IDENTITY=true
      - AUTH_PASSWORD=
      - REGISTRATION_MODE=off
      # Only Jordan can use Clio's admin console or manage the Access list.
      # CF_API_TOKEN remains provided through .env for the Access admin panel.
      - ADMIN_EMAILS=jordan.boyce@cyberlion.dev

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: clio-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env — see docs/REMOTE-ACCESS.md}
    depends_on:
      - clio
    restart: unless-stopped
