<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No inline script: the page's own is clio-page.js. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net https://huggingface.co https://*.hf.co https://*.huggingface.co; object-src 'none'; base-uri 'none'">
  <title>Search</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; color: #1f2933; background: #fff; }
    clio-search { --clio-search-accent: #1d4ed8; --clio-search-muted: #52606d; --clio-search-border: #9aa5b1; --clio-search-mark: #fde68a; }
    @media (prefers-color-scheme: dark) {
      body { color: #e4e7eb; background: #12161c; }
      clio-search { --clio-search-accent: #93c5fd; --clio-search-muted: #9aa5b1; --clio-search-border: #52606d; --clio-search-mark: #854d0e; }
    }
  </style>
</head>
<body>
  <h1 id="title">Search</h1>
  <!--
    The search box is <clio-search>, from clio-search.js beside this page. To
    put it in your own site's pages instead, see README.txt in this folder.

    Beside this page: search/ holds the export (manifest.json, the passages and,
    when it is searched by meaning, vectors.bin). An export made as a whole
    site ("Include the model" in Clio's Export dialog) carries the model and
    transformers.js in models/ and vendor/, and the box loads them from there,
    the first time someone uses it. Otherwise both come from public CDNs; on a
    network that blocks them, see "Hosting the model yourself" in
    docs/STATIC_SEARCH.md.
  -->
  <clio-search src="search/" label="Ask a question or type a few words"></clio-search>

  <script type="module" src="clio-page.js"></script>
</body>
</html>
